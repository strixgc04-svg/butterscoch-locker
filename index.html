<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Store Lock</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; background: #0a0a0c; color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      width: 100%; max-width: 400px; background: #18181b; border: 1px solid #27272a;
      border-radius: 16px; padding: 32px 24px;
    }
    h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
    .sub { margin: 0 0 28px; font-size: 14px; color: #a1a1aa; }
    .row {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 18px 16px; border-radius: 12px; background: #0f0f11; border: 1px solid #27272a; margin-bottom: 16px;
    }
    .state { font-size: 15px; font-weight: 600; }
    .state small { display: block; font-size: 13px; font-weight: 400; color: #a1a1aa; margin-top: 2px; }
    .switch { position: relative; width: 56px; height: 32px; flex-shrink: 0; }
    .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
    .switch input:disabled { cursor: wait; }
    .track {
      position: absolute; inset: 0; border-radius: 999px; background: #3f3f46; transition: background .2s;
    }
    .track::after {
      content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%;
      background: #fff; transition: transform .2s;
    }
    .switch input:checked + .track { background: #dc2626; }
    .switch input:checked + .track::after { transform: translateX(24px); }
    .switch input:focus-visible + .track { outline: 2px solid #f4f4f5; outline-offset: 2px; }
    .switch input:disabled + .track { opacity: .6; }
    .msg { min-height: 20px; margin: 0; font-size: 14px; color: #a1a1aa; }
    .msg.err { color: #f87171; }
    .msg.ok { color: #4ade80; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Store Lock</h1>
    <p class="sub">Switch ON to lock the storefront.</p>

    <div class="row">
      <div class="state" id="state">Checking…<small>&nbsp;</small></div>
      <div class="switch">
        <input type="checkbox" id="toggle" role="switch" aria-label="Store lock" disabled>
        <span class="track"></span>
      </div>
    </div>

    <p class="msg" id="msg" aria-live="polite"></p>
  </main>

  <script>
    var toggle = document.getElementById("toggle");
    var stateEl = document.getElementById("state");
    var msg = document.getElementById("msg");
    var live = null;

    function say(text, kind) {
      msg.textContent = text;
      msg.className = "msg" + (kind ? " " + kind : "");
    }

    function show(locked) {
      toggle.checked = locked;
      stateEl.innerHTML = locked
        ? 'ON: store locked<small>Visitors see the lock screen</small>'
        : 'OFF: store open<small>Visitors can shop normally</small>';
    }

    function fetchStatus() {
      return fetch("/status.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); });
    }

    function waitForLive(target, started) {
      fetchStatus().then(function (s) {
        if (s.locked === target) {
          live = target; show(target); toggle.disabled = false;
          say(target ? "Live: store is locked." : "Live: store is open.", "ok");
        } else if (Date.now() - started > 180000) {
          toggle.disabled = false;
          say("Saved to GitHub, but the deploy is taking long. Check Vercel.", "err");
        } else {
          setTimeout(function () { waitForLive(target, started); }, 3000);
        }
      }).catch(function () { setTimeout(function () { waitForLive(target, started); }, 3000); });
    }

    toggle.addEventListener("change", function () {
      var target = toggle.checked;
      toggle.disabled = true;
      say("Saving…");
      fetch("/api/toggle", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ locked: target })
      })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
        .then(function (res) {
          if (!res.ok) throw new Error(res.data.error || "Request failed");
          show(target);
          stateEl.querySelector("small").textContent = "Deploying… usually under a minute";
          say("Saved. Waiting for the deploy to go live…");
          waitForLive(target, Date.now());
        })
        .catch(function (err) {
          toggle.checked = live; toggle.disabled = false;
          say(err.message, "err");
        });
    });

    fetchStatus()
      .then(function (s) { live = s.locked === true; show(live); toggle.disabled = false; })
      .catch(function () { stateEl.firstChild.textContent = "Status unavailable"; });
  </script>
</body>
</html>
