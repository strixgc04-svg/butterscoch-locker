<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store Lock</title>
  <style>
    body { margin: 0; padding: 40px 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; color: #18181b; }
    main { max-width: 560px; margin: 0 auto; }
    code { background: #eee; padding: 2px 6px; border-radius: 4px; }
    .status { font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Store Lock</h1>
    <p>Current status: <span class="status" id="status">checking…</span></p>
    <p>Set <code>"locked": true</code> in <code>status.json</code> to lock. This page loads <code>lock.js</code> too, so it shows the lock screen when the lock is on.</p>
  </main>
  <script>
    fetch("status.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (s) { document.getElementById("status").textContent = s.locked ? "LOCKED" : "UNLOCKED"; })
      .catch(function () { document.getElementById("status").textContent = "unreachable"; });
  </script>
  <script src="lock.js"></script>
</body>
</html>
